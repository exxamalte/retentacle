<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest">
  <title>Retentacle icon (bold tentacle R)</title>
  <defs>
    <clipPath id="tile">
      <rect width="512" height="512" rx="96"/>
    </clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="#e3f4f7"/>

    <g transform="translate(-13 -5)">
      <g fill="none" stroke="#d6336c" stroke-linecap="round" stroke-linejoin="round">
        <!-- stem: the thick, rounded base of the tentacle -->
        <path d="M120 424 L120 330" stroke-width="116"/>
        <path d="M120 330 L120 150" stroke-width="106"/>

        <!-- bowl: the tentacle curls over the top, narrowing, and returns to the stem -->
        <path d="M120 150 C120 104 158 84 215 84" stroke-width="92"/>
        <path d="M215 84 C300 84 368 112 368 178" stroke-width="86"/>
        <path d="M368 178 C368 240 320 275 238 275" stroke-width="74"/>
        <path d="M238 275 C200 275 170 275 140 275" stroke-width="62"/>

        <!-- leg: a tapering arm that sweeps down, then swirls outwards at the tip -->
        <path d="M228 275 C298 285 345 312 345 385" stroke-width="80"/>
        <path d="M345 385 C345 445 392 478 436 446" stroke-width="60"/>
        <path d="M436 446 C474 422 458 380 422 386" stroke-width="38"/>
      </g>

      <!-- suckers running along the tentacle -->
      <g fill="#e3f4f7">
        <circle cx="120" cy="390" r="18"/>
        <circle cx="120" cy="335" r="17"/>
        <circle cx="120" cy="205" r="15"/>

        <circle cx="299" cy="297" r="14"/>
        <circle cx="333" cy="331" r="14"/>
        <circle cx="344" cy="368" r="12"/>
        <circle cx="360" cy="436" r="11"/>
        <circle cx="397" cy="458" r="10"/>
      </g>
    </g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
