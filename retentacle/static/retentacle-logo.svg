<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest">
  <title>Retentacle icon (small-size version, high contrast)</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d3556"/>
      <stop offset="1" stop-color="#051524"/>
    </linearGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6e6"/>
      <stop offset="1" stop-color="#f5c08f"/>
    </linearGradient>
    <clipPath id="tile">
      <rect width="512" height="512" rx="96"/>
    </clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#bg)"/>

    <!-- shell -->
    <path d="M180 410 L250 410 L270 442 L160 442 Z" fill="#e9a977" stroke="#b9663d" stroke-width="8" stroke-linejoin="round"/>
    <path d="M215 410 L50 255 C38 130 125 45 215 45 C305 45 392 130 380 255 Z" fill="url(#shell)" stroke="#b9663d" stroke-width="10" stroke-linejoin="round"/>
    <g stroke="#c9774c" stroke-width="12" stroke-linecap="round">
      <line x1="215" y1="410" x2="125" y2="118"/>
      <line x1="215" y1="410" x2="215" y2="52"/>
      <line x1="215" y1="410" x2="305" y2="118"/>
    </g>

    <!-- tentacle outline (dark) separates it from the shell -->
    <g fill="none" stroke="#3a0a24" stroke-linecap="round" stroke-linejoin="round">
      <path d="M470 580 C470 490 450 440 400 410" stroke-width="138"/>
      <path d="M400 410 C345 385 280 370 225 350" stroke-width="112"/>
      <path d="M225 350 C165 330 115 320 105 275" stroke-width="86"/>
      <path d="M105 275 C100 245 130 232 150 246" stroke-width="64"/>
    </g>

    <!-- tentacle: bright hot pink against the dark navy background -->
    <g fill="none" stroke="#ff4f87" stroke-linecap="round" stroke-linejoin="round">
      <path d="M470 580 C470 490 450 440 400 410" stroke-width="118"/>
      <path d="M400 410 C345 385 280 370 225 350" stroke-width="94"/>
      <path d="M225 350 C165 330 115 320 105 275" stroke-width="70"/>
      <path d="M105 275 C100 245 130 232 150 246" stroke-width="48"/>
    </g>

    <!-- suckers -->
    <g fill="#ffd3e0">
      <circle cx="447" cy="496" r="16"/>
      <circle cx="437" cy="462" r="14"/>
      <circle cx="346" cy="402" r="13"/>
      <circle cx="272" cy="380" r="12"/>
    </g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
