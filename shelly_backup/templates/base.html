<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ application_name }}{% endblock %}</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f3f5fb;
      --surface: #ffffff;
      --surface-muted: #f8f9fc;
      --border: #e2e6ef;
      --text: #1c2333;
      --muted: #667085;
      --accent: #2563eb;
      --accent-strong: #1d4ed8;
      --accent-soft: #e8efff;
      --success: #067647;
      --success-soft: #e7f6ee;
      --warning: #b54708;
      --warning-soft: #fff4e5;
      --danger: #b42318;
      --danger-soft: #fef0ef;
      --hover: #f7f9fd;
      --code-bg: #f6f8fc;
      --shadow: 0 1px 2px rgb(16 24 40 / 4%), 0 8px 24px rgb(16 24 40 / 5%);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0e1320;
        --surface: #161d2d;
        --surface-muted: #1b2335;
        --border: #2a3448;
        --text: #e8edf7;
        --muted: #9aa6bd;
        --accent: #7aa2ff;
        --accent-strong: #a4bcff;
        --accent-soft: #1e2c4d;
        --success: #6ce9a6;
        --success-soft: #123526;
        --warning: #fdb022;
        --warning-soft: #3a2a10;
        --danger: #fda29b;
        --danger-soft: #3d1a19;
        --hover: #1b2335;
        --code-bg: #111827;
        --shadow: 0 1px 2px rgb(0 0 0 / 30%), 0 8px 24px rgb(0 0 0 / 25%);
      }
    }

    * {
      box-sizing: border-box;
    }

    [hidden] {
      display: none !important;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: var(--accent);
      text-decoration: none;
    }

    a:hover {
      color: var(--accent-strong);
      text-decoration: underline;
    }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: color-mix(in srgb, var(--surface) 92%, transparent);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(10px);
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
      max-width: 1120px;
      margin: 0 auto;
      padding: 0.8rem 1.25rem;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 0.65rem;
      color: var(--text);
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .brand:hover {
      color: var(--text);
      text-decoration: none;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 2.1rem;
      height: 2.1rem;
      border-radius: 0.65rem;
      background: linear-gradient(135deg, var(--accent), #7c3aed);
      color: #ffffff;
      font-size: 0.85rem;
      font-weight: 800;
      letter-spacing: 0.02em;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    main {
      max-width: 1120px;
      margin: 0 auto;
      padding: 1.75rem 1.25rem 3.5rem;
    }

    .page-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
      margin-bottom: 1.35rem;
    }

    h1 {
      margin: 0 0 0.2rem;
      font-size: clamp(1.55rem, 3vw, 2rem);
      line-height: 1.2;
      letter-spacing: -0.02em;
    }

    h2 {
      margin: 0 0 0.75rem;
      font-size: 1.05rem;
      letter-spacing: -0.01em;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
    }

    .breadcrumb {
      margin: 0 0 1rem;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.9em;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      padding: 0.55rem 0.95rem;
      border: 1px solid var(--border);
      border-radius: 0.55rem;
      background: var(--surface);
      color: var(--text);
      font: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 120ms ease, border-color 120ms ease,
        transform 120ms ease;
    }

    .button:hover {
      background: var(--hover);
      border-color: var(--muted);
      color: var(--text);
      text-decoration: none;
    }

    .button:active {
      transform: translateY(1px);
    }

    .button.primary {
      border-color: transparent;
      background: var(--accent);
      color: #ffffff;
    }

    .button.primary:hover {
      background: var(--accent-strong);
      border-color: transparent;
      color: #ffffff;
    }

    .button.small {
      padding: 0.35rem 0.65rem;
      font-size: 0.82rem;
    }

    .card {
      padding: 1.1rem 1.25rem;
      border: 1px solid var(--border);
      border-radius: 0.9rem;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 0.9rem;
      margin-bottom: 1.25rem;
    }

    .stat-label {
      margin: 0 0 0.3rem;
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.07em;
      text-transform: uppercase;
    }

    .stat-value {
      margin: 0;
      font-size: 1.02rem;
      font-weight: 650;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 0.18rem 0.55rem;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent-strong);
      font-size: 0.76rem;
      font-weight: 650;
      white-space: nowrap;
    }

    .badge.success {
      background: var(--success-soft);
      color: var(--success);
    }

    .badge.warning {
      background: var(--warning-soft);
      color: var(--warning);
    }

    .badge.muted {
      background: var(--surface-muted);
      color: var(--muted);
    }

    .notice,
    .alert {
      margin: 0 0 1.25rem;
      padding: 0.85rem 1rem;
      border: 1px solid var(--border);
      border-radius: 0.7rem;
      font-size: 0.92rem;
    }

    .notice {
      border-color: color-mix(in srgb, var(--accent) 35%, var(--border));
      background: var(--accent-soft);
      color: var(--text);
    }

    .alert {
      border-color: color-mix(in srgb, var(--danger) 40%, var(--border));
      background: var(--danger-soft);
      color: var(--text);
    }

    .alert strong {
      color: var(--danger);
    }

    .table-wrap {
      overflow-x: auto;
      margin: 0 -0.35rem;
      padding: 0 0.35rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 0.8rem 0.85rem;
      border-bottom: 1px solid var(--border);
      text-align: left;
      vertical-align: middle;
      white-space: nowrap;
    }

    th {
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 650;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    tbody tr:last-child td {
      border-bottom: 0;
    }

    tbody tr:hover {
      background: var(--hover);
    }

    .device-name {
      font-weight: 650;
    }

    .device-ip {
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.82rem;
    }

    .row-actions {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    .empty {
      padding: 2.75rem 1.25rem;
      text-align: center;
    }

    .empty h2 {
      margin-bottom: 0.35rem;
      font-size: 1.15rem;
    }

    .empty p {
      max-width: 34rem;
      margin: 0 auto 1.25rem;
      color: var(--muted);
    }

    .meta-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem 1.5rem;
      margin: 0;
    }

    .meta-list dt {
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 650;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .meta-list dd {
      margin: 0.15rem 0 0;
      font-weight: 550;
      overflow-wrap: anywhere;
    }

    .json-card {
      margin-top: 1.25rem;
    }

    pre {
      max-height: 70vh;
      margin: 0;
      padding: 1rem 1.1rem;
      overflow: auto;
      border: 1px solid var(--border);
      border-radius: 0.65rem;
      background: var(--code-bg);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.82rem;
      line-height: 1.5;
      tab-size: 2;
    }

    .footer-note {
      margin-top: 1.5rem;
      color: var(--muted);
      font-size: 0.8rem;
    }

    .backup-progress {
      margin: 0 0 1.25rem;
      padding: 0.9rem 1rem;
      border: 1px solid var(--border);
      border-radius: 0.7rem;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .backup-progress-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 0.55rem;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .backup-progress-count {
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .progress-track {
      height: 0.6rem;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface-muted);
    }

    .progress-fill {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--accent), #7c3aed);
      transition: width 220ms ease;
    }

    .progress-fill.indeterminate {
      width: 35%;
      animation: progress-indeterminate 1.2s ease-in-out infinite;
    }

    @keyframes progress-indeterminate {
      0% {
        transform: translateX(-110%);
      }

      100% {
        transform: translateX(320%);
      }
    }

    @media (max-width: 640px) {
      main {
        padding: 1.25rem 0.9rem 2.5rem;
      }

      .header-inner {
        padding: 0.7rem 0.9rem;
      }

      .brand-text {
        font-size: 0.95rem;
      }

      th,
      td {
        white-space: normal;
      }

      .row-actions {
        flex-wrap: wrap;
      }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="/">
        <span class="brand-mark" aria-hidden="true">SB</span>
        <span class="brand-text">{{ application_name }}</span>
      </a>
      <div class="header-actions">
        <form method="post" action="/backup?redirect={{ request.url.path }}">
          <button class="button primary" type="submit">Run backup now</button>
        </form>
      </div>
    </div>
  </header>
  <main>
    <div class="backup-progress" data-backup-progress hidden aria-live="polite">
      <div class="backup-progress-header">
        <span data-progress-title>Backup in progress…</span>
        <span class="backup-progress-count" data-progress-count></span>
      </div>
      <div
        class="progress-track"
        data-progress-track
        role="progressbar"
        aria-label="Backup progress"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="0"
      >
        <div class="progress-fill" data-progress-fill></div>
      </div>
    </div>
    {% block content %}{% endblock %}
  </main>
  <script>
    (() => {
      const initialRunCount = Number("{{ request.app.state.scheduler.run_count }}");
      const initialActive = {{ 'true' if request.app.state.scheduler.active else 'false' }};
      const progress = document.querySelector('[data-backup-progress]');
      const track = document.querySelector('[data-progress-track]');
      const fill = document.querySelector('[data-progress-fill]');
      const title = document.querySelector('[data-progress-title]');
      const count = document.querySelector('[data-progress-count]');
      const statusBadge = document.querySelector('[data-scheduler-status]');

      let sawActive = initialActive;
      let lastRunCount = initialRunCount;

      function renderProgress(status) {
        const info = status.progress || {};
        const total = Number(info.total) || 0;
        const completed = Number(info.completed) || 0;
        const hasProgress = Boolean(status.queued) || total > 0;

        if (!status.active) {
          if (sawActive) {
            const results = Array.isArray(info.results) ? info.results : [];
            const failures = results.filter((result) => !result.success).length;
            progress.hidden = false;
            fill.classList.remove('indeterminate');
            fill.style.width = '100%';
            track.setAttribute('aria-valuenow', '100');
            title.textContent = status.last_error || failures > 0
              ? 'Backup finished with errors'
              : 'Backup complete';
            if (failures > 0) {
              count.textContent = failures + ' failed';
            } else {
              count.textContent = total > 0 ? completed + ' of ' + total : '';
            }
          } else {
            progress.hidden = true;
          }
          return;
        }

        if (!hasProgress) {
          progress.hidden = true;
          return;
        }

        progress.hidden = false;
        if (total > 0) {
          const percent = Math.min(
            100,
            Math.round((completed / total) * 100)
          );
          fill.classList.remove('indeterminate');
          fill.style.width = percent + '%';
          track.setAttribute('aria-valuenow', String(percent));
          title.textContent = completed >= total
            ? 'Backup complete'
            : 'Backing up devices…';
          count.textContent = completed + ' of ' + total;
        } else {
          fill.classList.add('indeterminate');
          fill.style.width = '';
          track.setAttribute('aria-valuenow', '0');
          title.textContent = 'Starting backup…';
          count.textContent = '';
        }
      }

      function renderStatus(status) {
        if (!statusBadge) {
          return;
        }
        if (status.active) {
          statusBadge.textContent = 'Backup running';
          statusBadge.className = 'badge warning';
        } else {
          statusBadge.textContent = status.enabled
            ? 'Scheduled'
            : 'Automatic backups off';
          statusBadge.className = status.enabled
            ? 'badge success'
            : 'badge muted';
        }
      }

      async function poll() {
        let status;
        try {
          const response = await fetch('/api/status', {
            headers: { Accept: 'application/json' },
            cache: 'no-store',
          });
          if (!response.ok) {
            throw new Error('Status request failed');
          }
          status = await response.json();
        } catch (error) {
          window.setTimeout(poll, 2000);
          return;
        }

        if (status.active) {
          sawActive = true;
        }

        renderProgress(status);
        renderStatus(status);

        const finished = !status.active && sawActive;
        const changed = status.run_count !== lastRunCount;
        if (!status.active && (finished || changed)) {
          // Let the completed bar show briefly, then reload without the
          // query string so one-off notices disappear.
          window.setTimeout(() => {
            window.location.replace(window.location.pathname);
          }, 500);
          return;
        }

        if (!status.active) {
          sawActive = false;
          lastRunCount = status.run_count;
        }

        window.setTimeout(poll, status.active ? 500 : 2000);
      }

      poll();
    })();
  </script>
</body>
</html>
