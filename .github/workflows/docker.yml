name: Container

on:
  push:
    tags:
    - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and publish container image
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/retentacle
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Show image name
      run: echo "Publishing $IMAGE_NAME"

    - name: Classify the tag
      id: flags
      if: github.ref_type == 'tag'
      run: |
        version="${GITHUB_REF_NAME#v}"
        # Mirror release.yml: only plain numeric versions are stable tags.
        if [[ "$version" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
          echo "prerelease=false" >> "$GITHUB_OUTPUT"
        else
          echo "prerelease=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Read application version
      id: version
      run: |
        python3 - <<'PY'
        import os
        import re
        import tomllib

        with open("pyproject.toml", "rb") as handle:
            project_version = tomllib.load(handle)["project"]["version"]
        # Docker tags may only contain [A-Za-z0-9_.-].
        docker_version = re.sub(r"[^A-Za-z0-9_.-]", "-", project_version)
        with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
            handle.write(f"version={docker_version}\n")
        print(f"Application version: {docker_version}")
        PY

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Docker metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.IMAGE_NAME }}
        tags: |
          # Development builds: branch, commit and the pyproject version.
          type=ref,event=branch
          type=sha
          type=raw,value=${{ steps.version.outputs.version }},enable=${{ github.ref_type != 'tag' }}
          # Releases: vX.Y.Z tags get the plain version and become latest.
          # Prereleases (-alpha, -beta, -rc, -dev, b1, …) keep only their
          # tag name and never become latest (flags step mirrors release.yml).
          type=ref,event=tag
          type=semver,pattern={{version}}
          type=raw,value=latest,enable=${{ github.ref_type == 'tag' && steps.flags.outputs.prerelease == 'false' }}

    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: .
        file: docker/Dockerfile
        platforms: linux/amd64,linux/arm64
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
